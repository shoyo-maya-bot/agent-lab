name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "mcp-server[dev]" pyyaml
      - run: ruff check . && ruff format --check .
      - name: MCP server
        run: |
          set -o pipefail
          pytest -q mcp-server/tests 2>&1 | tee mcp-test.log || { grep -E "Error|error|FAILED|assert" mcp-test.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: scorer
        run: pytest -q runner/tests
