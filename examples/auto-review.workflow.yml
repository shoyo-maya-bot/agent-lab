# PR を自動でレビューする（auto-review）. 対象のリポジトリの .github/workflows/auto-review.yml にコピーして使う.
#
# 必要なもの:
#   - リポジトリの Secrets に ANTHROPIC_API_KEY（無ければ「見積もりだけ」のコメントになる）
#   - 社内の中継・閉域の窓口に向けるときは Variables に ANTHROPIC_BASE_URL
#   - 費用の上限は 2 段で: router.yaml の budget.per_pr_usd（1 PR）と、API 側のワークスペースの月の上限
#
# pull_request で動かす（pull_request_target は使わない）. フォークからの PR には Secrets が渡らないので、見積もりだけになる.
name: auto-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || startsWith(github.event.label.name, 'review:'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: auto-review を入れる
        run: pip install "auto-review @ git+https://github.com/shoyo-maya-bot/agent-lab.git@main#subdirectory=auto-review"
      - name: 差分を取る
        run: |
          # synchronize では前回からの差分だけを見る（同じ箇所に何度も費用をかけない）
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -n "${{ github.event.before }}" ]; then
            git diff "${{ github.event.before }}" "${{ github.event.after }}" > pr.diff
          else
            git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          fi
          wc -l pr.diff
      - name: レビュー
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          YES=""
          [ -n "$ANTHROPIC_API_KEY" ] && YES="--yes"
          # 終了コード 1（MUST あり）でもジョブは失敗にしない. AI の指摘は下書きで、採否は人が決める
          auto-review run pr.diff --repo . --labels "$LABELS" --author "$AUTHOR" $YES \
            --out-md comment.md --out-json auto-review.json -f json > /dev/null || [ $? -eq 1 ]
      - name: コメントを書く（前回のコメントがあれば置き換える）
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- auto-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: auto-review
          path: auto-review.json
