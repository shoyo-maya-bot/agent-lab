# PR を自動でレビューする（auto-review）. 対象のリポジトリの .github/workflows/auto-review.yml にコピーして使う.
#
# 必要なもの:
#   - リポジトリの Secrets に ANTHROPIC_API_KEY（無ければ「見積もりだけ」のコメントになる）
#   - 社内の中継・閉域の窓口に向けるときは Variables に ANTHROPIC_BASE_URL
#   - 費用の上限は 3 段で: router.yaml の budget.per_pr_usd（1 回の実行あたり）、budget.per_pr_total_usd（同じ PR の実行の累計.
#     前回のコメントの隠しマーカーに残した額を --prior-comment で渡して判定する）と、API 側のワークスペースの月の上限
#     （push のたびに PR 全体を見直すので、per_pr_usd だけでは PR あたりの額は決まらない）
#
# actions はタグではなくコミット SHA で固定する（タグは付け替えられるため. Dependabot の github-actions で上げる）.
# pull_request で動かす（pull_request_target は使わない）. フォークからの PR では Secrets が渡らず、コメントも書けないので動かさない.
# PR の中身（差分・ファイル）は信用しないデータとして扱う: 認証情報を checkout に残さない、シンボリックリンクは読まない（auto-review 側）、
# LLM の出力は無害化してからコメントにする.
# ${{ }} の式は run: に直接埋め込まず、手順の env: で渡してシェル変数として使う（ブランチ名などでコマンドを注入させない）.
# 終了コード 2 は「入力・設定（router.yaml）の誤り」、3 は「モデルを呼べない・出力を読めない・予算（1 回の実行あたり・PR の累計）を
# 超える見込みで呼ばなかった・想定外のエラー」.
name: auto-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || startsWith(github.event.label.name, 'review:'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # トークンを .git/config に残さない
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: auto-review を入れる（コミット SHA で固定する）
        env:
          REF: ${{ vars.AUTO_REVIEW_REF }}   # リポジトリの Variables に agent-lab のコミット SHA を入れる
        run: |
          [ -n "$REF" ] || { echo "::error::Variables の AUTO_REVIEW_REF にコミット SHA を入れてください"; exit 1; }
          # 依存の版も、同じ SHA の constraints.txt（agent-lab の deps-lock が作る）でそろえる
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/constraints.txt" \
            "https://raw.githubusercontent.com/shoyo-maya-bot/agent-lab/${REF}/constraints.txt"
          pip install -c "$RUNNER_TEMP/constraints.txt" \
            "auto-review @ git+https://github.com/shoyo-maya-bot/agent-lab.git@${REF}#subdirectory=auto-review"
      - name: 差分を取る
        env:
          # 式（${{ }}）は run: に直接埋め込まず env で渡す（値がスクリプトとして解釈されないように）
          BASE_REF: ${{ github.base_ref }}
        run: |
          # いつも PR 全体の差分を見る（追加の push のたびに前の指摘が消えないように. 費用は 1 回数セント. 累計は per_pr_total_usd で抑える）
          git diff "origin/${BASE_REF}...HEAD" > pr.diff
          wc -l pr.diff
      - name: 前回のコメントを読む（PR の累計の費用の記録. github-actions[bot] が書いたものだけ）
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- auto-review -->")) | .body' \
            > prev-comment.md
          wc -c prev-comment.md
      - name: レビュー
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          YES=""
          [ -n "$ANTHROPIC_API_KEY" ] && YES="--yes"
          # 終了コード 1（MUST あり）でもジョブは失敗にしない. AI の指摘は下書きで、採否は人が決める.
          # 2（設定の誤り）・3（モデルを呼べない・出力を読めない・予算超過）は失敗にする（「指摘 0 件」と見分けるため）
          set +e
          auto-review run pr.diff --repo . --labels "$LABELS" --author "$AUTHOR" $YES --prior-comment prev-comment.md \
            --out-md comment.md --out-json auto-review.json -f json > /dev/null
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"
      - name: コメントを書く（前回のコメントがあれば置き換える）
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- auto-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-review
          path: auto-review.json
