[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools-mcp"
version = "0.1.0"
description = "devtools の CLI（doc2md・design-diff・fieldcheck・spec-trace）を AI エージェントの道具として使う MCP サーバー（stdio・読み取り中心）"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]  # 2.x（MCPServer）. 3.x は API が変わりうるので、上げるときは手作業で

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
devtools-mcp = "devtools_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 170

[tool.pytest.ini_options]
testpaths = ["tests"]
