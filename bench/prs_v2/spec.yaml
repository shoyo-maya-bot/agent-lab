    edits:
      - file: sample-app/src/main/resources/mapper/OrderMapper.xml
        old: "    INSERT INTO orders (order_no, member_id, product_code, quantity)\n    VALUES (#{orderNo}, #{memberId}, #{productCode}, #{quantity})\n"
        new: "    INSERT INTO orders (\n      order_no, member_id, product_code, quantity\n    ) VALUES (\n      #{orderNo}, #{productCode}, #{memberId}, #{quantity}\n    )\n"
    answer:
      file: sample-app/src/main/resources/mapper/OrderMapper.xml
      anchor: "#{orderNo}, #{productCode}, #{memberId}, #{quantity}"
      symbol: OrderMapper.insertIfAbsent
      severity: MUST
      severity_ok: [MUST]
      summary: VALUES の memberId と productCode の順が列の並びと逆になり、member_id（BIGINT）に商品コードの文字列を入れようとして、取込の登録がすべて失敗する
      detail: 列は (order_no, member_id, product_code, quantity) なのに、値は (orderNo, productCode, memberId, quantity)。PostgreSQL では型の不一致で例外になり、取込のトランザクション全体が取り消される。単体テストは偽の Mapper を使うので気づけない
      leak_terms: ["列の順", "入れ替", "順番が", "型が合わ", "bigint", "逆になって"]

