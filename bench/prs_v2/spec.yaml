    description: getOptionValues は未指定なら null を返すので、null だけを確かめるようにしました。登録 API に説明も足しています。
    noise: [n_controller_doc, n_messages_comment]
    edits:
      - file: sample-app/src/main/java/com/example/sample/order/batch/OrderImportJob.java
        old: "        if (input == null || input.size() != 1) {\n"
