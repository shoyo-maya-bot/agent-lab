      severity: WANT
      severity_ok: [WANT, MUST]
      summary: 値の無い --input では空のリストが返り、try の外の input.get(0) で例外になって終了コード 8 にならない。--input を 2 つ渡すと 2 つ目以降が黙って無視される
      detail: getOptionValues は「--input」だけ（値なし）なら空のリストを返す。開始ログの input.get(0) は try の外なので、例外がそのまま起動の失敗になり、決めてある終了コード（8）と引数誤りのログ（APPE0005）が出ない
      leak_terms: ["IndexOutOfBounds", "空のリスト", "2 つ以上", "複数指定", "終了コード 1", "無視され"]

  - key: bug-s3-charset
    kind: bug
    title: S3 から読む処理の整理
    description: S3 から読む処理の書き方をそろえました。README とエラー応答の説明も少し直しています。
    noise: [n_errorresponse_doc, n_readme]
    edits:
      - file: sample-app/src/main/java/com/example/sample/order/batch/DefaultFileFetcher.java
        old: "                BufferedReader reader = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8))) {\n"
        new: "                BufferedReader reader = new BufferedReader(new InputStreamReader(in))) {\n"
    answer:
      file: sample-app/src/main/java/com/example/sample/order/batch/DefaultFileFetcher.java
      anchor: "new InputStreamReader(in))"
      symbol: DefaultFileFetcher.readLines
      severity: MUST
      severity_ok: [MUST, WANT]
