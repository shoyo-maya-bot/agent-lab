      detail: InputStreamReader(in) は Java 17 では file.encoding（OS のロケール）に従う。ローカルファイルの側は UTF-8 のままなので、ローカルの確認では気づけず、S3 経由のときだけ商品コードなどが化ける・見出し行の比較に失敗する
      leak_terms: ["文字コード", "文字化け", "化ける", "既定の文字", "charset", "UTF-8", "defaultCharset", "ロケール"]

  - key: bug-sql-values
