# PR レビューの課題 v2 の元データ（答えを含む. モデルには渡さない）
#
# 作り方: python bench/prs_v2/make_prs_v2.py <dev-environment のパス>
#   → tasks/T01.diff …（モデルに渡す差分）、cases.yaml（モデルに渡す題名と説明）、answers.yaml（採点する人だけが見る答え）
#
# v1（bench/prs）との違い（docs/EXPERIMENT_V2.md）:
#   - 説明のコメントとテストを消さない（差分に答えが出ないように）. 足すのはよい
#   - バグと関係のない小さな変更（noise）を混ぜる。同じ noise を、問題の無い PR・おとりの PR にも使う
#   - バグの場所を散らす（Java・XML・YAML・properties・Gradle）
#   - 題名と説明には「何をしたか（作者の意図）」だけを書き、不具合の説明を書かない
#   - ID は種類（バグ・問題なし・おとり）が分からないように、決まった乱数で並べ替えて T01〜 を振る
#
# 種類:
#   bug   : 不具合を 1 つ入れた PR. answer に場所・正しい重要度・正確な説明・漏れてはいけない語（leak_terms）
#   clean : 問題の無いふつうの PR（テストの追加・文書・名前の変更）
#   decoy : 危なそうに見えるが正しい PR（おとり）. answer.why_correct に正しい理由
#
# 編集の書き方は bench/prs/make_prs.py と同じ（old/new. old はちょうど 1 か所に一致すること）.
target: dev-environment
base_commit: 49d093f0a2b1604de223ebe80d9d62ad7523e6a4  # dev-environment の main（修正済み）
