  # ======================================================================== bug
  - key: bug-quantity-max
    kind: bug
    title: 取込の数量の上限を定数にする
    description: 数量の上限をメソッドの中に直接書いていたので、定数にしました。README の表記も少し直しています。
    noise: [n_readme, n_record_doc]
    edits:
      - file: sample-app/src/main/java/com/example/sample/order/OrderImportService.java
        old: "    static final int CODE_MAX_LENGTH = 20;\n"
        new: "    static final int CODE_MAX_LENGTH = 20;\n\n    /** 数量の上限. */\n    static final int QUANTITY_MAX = 999;\n"
      - file: sample-app/src/main/java/com/example/sample/order/OrderImportService.java
        old: "        if (quantity < 1 || quantity > 999) {"
        new: "        if (quantity < 1 || quantity >= QUANTITY_MAX) {"
    answer:
      file: sample-app/src/main/java/com/example/sample/order/OrderImportService.java
      anchor: "quantity >= QUANTITY_MAX"
      symbol: OrderImportService.parse
      severity: MUST
      severity_ok: [MUST, WANT]
      summary: 数量の判定が「QUANTITY_MAX 以上なら誤り」になり、仕様と DB の CHECK で正しい値である 999 の行が取り込まれなくなる
      detail: 比較が > 999 から >= 999 に変わった。数量 999 の行は形式エラーとして飛ばされ、終了コードも 4 になる。エラーの文言は「1〜999 です」のままで食い違う
      leak_terms: ["999 を", "999 以上", "999 未満", "上限値を含", "含まない", "off-by-one", "境界値"]

