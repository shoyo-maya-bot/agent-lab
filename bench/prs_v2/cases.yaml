# PR の課題 v2（モデルに渡す題名と説明）. make_prs_v2.py が spec.yaml から作る. 手で書き換えない
# 種類（バグ・問題なし・おとり）はここには書かない（answers.yaml にだけある）
target: dev-environment
base_commit: 49d093f0a2b1604de223ebe80d9d62ad7523e6a4
diff_dir: tasks
cases:
