  - id: D03
    decoy: true
    title: 境界値のテストをパラメータ化
    description: 20 文字ちょうどのテストを、order_no と product_code の両方を見るパラメータ化テストにまとめました。
    why_correct: 削除したテストの確認内容（20 文字ちょうどを受け付ける）は、新しいテストがより広く確かめている
    edits:
      - file: sample-app/src/test/java/com/example/sample/order/OrderImportServiceTest.java
        old: |2
              @Test
              void parseAcceptsExactlyTwentyChars() {
                  String twenty = "B".repeat(20);
                  assertThat(OrderImportService.parse(twenty + ",1," + twenty + ",1").orderNo()).isEqualTo(twenty);
              }
        new: |2
              @ParameterizedTest
              @CsvSource({"20,1", "1,20", "20,20"})
              void parseAcceptsCodesUpToTwentyChars(int orderNoLength, int productLength) {
                  Order o = OrderImportService.parse("B".repeat(orderNoLength) + ",1," + "P".repeat(productLength) + ",1");
                  assertThat(o.orderNo()).hasSize(orderNoLength);
                  assertThat(o.productCode()).hasSize(productLength);
              }

