# PR 単位のレビュー課題. sample-app の修正済みの main（base_commit）に、弱いところを 1 つだけ戻す PR を作る.
# 弱いところを含まない PR（N0x）も混ぜて、「何もない PR で騒がないか」「Opus に上げすぎないか」も見る.
#
# 作り方: python bench/prs/make_prs.py <dev-environment のパス>   → bench/prs/<id>.diff
# 採点:   expect の正解（bench/bugs/sample-app-known.yaml の ID）を見つけたか。expect が無い PR は MUST・WANT の数を「誤警報」として数える
target: dev-environment
base_commit: e68db72b6d4513072890ce37a4b8f6e5a913db8c
