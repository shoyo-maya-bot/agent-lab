  - id: D01
    decoy: true
    title: 会員登録の重複確認を一意制約に一本化
    description: 事前の existsByEmail をやめ、DB の一意制約（DuplicateKeyException → 409）だけで判定します。SELECT が 1 回減ります。
    why_correct: insert の DuplicateKeyException を 409（APPE0003）に変換する処理は残っているので、重複時の結果は変わらない
    edits:
      - file: sample-app/src/main/java/com/example/sample/member/MemberService.java
        old: |2
                  // 事前の確認は「よくある重複」を早く返すため。同時に登録されたときの最終的な判定は DB の一意制約に任せる
                  if (mapper.existsByEmail(normalized)) {
                      throw new BusinessException(MessageIds.EMAIL_ALREADY_USED, normalized);
                  }
        new: |2
                  // 重複の判定は DB の一意制約に任せる（同時に登録されても 409 になる）
      - file: sample-app/src/test/java/com/example/sample/member/MemberServiceTest.java
        old: |2
                  @Override
                  public int insert(MemberRecord member) {
                      member.setId(++seq);
        new: |2
                  @Override
                  public int insert(MemberRecord member) {
                      if (existsByEmail(member.getEmail())) {
                          throw new org.springframework.dao.DuplicateKeyException("member_email_key");
                      }
                      member.setId(++seq);

